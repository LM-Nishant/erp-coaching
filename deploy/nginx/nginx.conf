# Main configuration of the erp-web image. The ERP servers are in /etc/nginx/erp/erp.conf, rendered at
# container start from /etc/nginx/templates/erp.conf.template by the image entrypoint (see
# /docker-entrypoint.d/18-erp-config.envsh). Extra http-level settings (e.g. set_real_ip_from when a
# load balancer sits in front) can be mounted into /etc/nginx/conf.d/*.conf.
user nginx;
worker_processes auto;
worker_rlimit_nofile 16384;

# The official image links these log files to the container's stderr/stdout.
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/erp/erp.conf;
}
