# Quality gate for every pull request and every push to main (see CONTRIBUTING.md › CI).
# The nightly run also runs the backend suite in reverse and shuffled file order.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Keep npm quiet and fast on CI.
  npm_config_fund: false
  npm_config_audit: false

jobs:
  quality:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  app-tests:
    name: App and shared tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -w @erp/shared --if-present
      - run: npm run test -w app

  backend-tests:
    name: Backend tests (MySQL 8, ${{ matrix.order }} order)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        order: ${{ github.event_name == 'schedule' && fromJSON('["alphabetical","reverse","shuffle"]') || fromJSON('["alphabetical"]') }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: erp_coaching_test
      TEST_FILE_ORDER: ${{ matrix.order != 'alphabetical' && matrix.order || '' }}
      # Printed by the sequencer; rerun locally with the same TEST_FILE_SEED to reproduce.
      TEST_FILE_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -w backend

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Reads package-lock.json only; high+ in production deps or critical anywhere fails the job.
      - run: node scripts/audit-check.mjs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # Rules: the defaults plus .gitleaks.toml. Fake test keys must start with sk-test-.
      - run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s
          --health-retries=30
    env:
      CI: true
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: erp_coaching_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.tmp/outbox.jsonl
          retention-days: 14

  deploy:
    name: Deployment (shellcheck, Compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      # Container entrypoints, certificate hooks, backup/restore scripts and the smoke test.
      - name: shellcheck
        run: git ls-files -z 'deploy/*.sh' 'deploy/*.envsh' | xargs -0 "$RUNNER_TEMP/shellcheck" --external-sources
      # Builds the api, web and backup images, starts the stack with throwaway secrets and checks it
      # through nginx: TLS, Socket.IO, custom domains, probes, seeding, backup. See the script header.
      - name: Compose smoke test
        run: deploy/smoke-test.sh

  backup-restore:
    name: Backup restore test (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Seeds a scratch database and media, backs both up, restores them elsewhere and compares
      # everything; also checks tamper detection, the --force guard and retention.
      - name: Restore test
        run: |
          mysqldump --version
          deploy/backup/restore-test.sh

  android:
    name: Android build (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Capacitor 8 compiles with Java 21 (capacitor.build.gradle) and needs compileSdk 36.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build -w @erp/shared && npm run build -w app
      - run: npx cap sync android
        working-directory: app
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: app/android
      # POST_NOTIFICATIONS (Android 13+) is not declared by the app itself; it must arrive through
      # firebase-messaging (pulled in by @capacitor/push-notifications) during manifest merging.
      - name: Check merged manifest declares POST_NOTIFICATIONS
        working-directory: app/android/app/build/intermediates
        run: |
          manifests=$(find . -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml)
          test -n "$manifests" || { echo "::error::No merged debug manifest found"; exit 1; }
          echo "$manifests"
          grep -l 'android.permission.POST_NOTIFICATIONS' $manifests \
            || { echo "::error::POST_NOTIFICATIONS missing from the merged manifest"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS build (unsigned, simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @erp/shared && npm run build -w app
      - run: npx cap sync ios
        working-directory: app
      # Package.resolved is committed; fail if `cap sync` or resolution would change any tracked file.
      - name: Resolve Swift packages
        working-directory: app/ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- . || { echo "::error::cap sync / package resolution changed tracked iOS files"; exit 1; }
      - name: xcodebuild (CODE_SIGNING_ALLOWED=NO)
        working-directory: app/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO build
