# Version updates. Security updates are raised as soon as an advisory is published (enable
# "Dependabot security updates" in the repository settings); see docs/security.md.
version: 2
updates:
  # One lockfile for every workspace (backend, app, packages/shared, e2e, load).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types must match the Node major we run (22: engines, CI NODE_VERSION, deploy/*.Dockerfile).
      # Move this bound together with the runtime when upgrading Node.
      - dependency-name: '@types/node'
        versions: ['>=23']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # Base images of the API, web and backup images.
  - package-ecosystem: docker
    directories: [/deploy, /deploy/backup]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A MySQL server major is a planned data upgrade (backup, LTS to LTS: 8.4 -> 9.7), not a routine bump.
      # Keep deploy/docker-compose.yml, deploy/backup/Dockerfile and the CI service images on one version.
      - dependency-name: mysql
        update-types: ['version-update:semver-major']

  # mysql, redis and nginx images in the compose stack.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: mysql
        update-types: ['version-update:semver-major']
